[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marvel-drowsiness-detection"
version = "0.0.0"
description = "Scaffold for the MARVEL EAR, CNN and fusion comparison"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
