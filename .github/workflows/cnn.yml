name: CNN cognition checks
on:
  push:
    branches: [cnn]
  pull_request:
    paths:
      - 'src/marvel/training/**'
      - 'src/marvel/cognition/cnn*'
      - 'scripts/*dataset.py'
      - 'scripts/train_cnn.py'
      - 'scripts/evaluate.py'
      - 'tests/test_cnn_pipeline.py'
      - 'tests/test_dataset.py'
      - 'tests/test_inference_contract.py'
      - 'environments/windows-training.txt'
      - '.github/workflows/cnn.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            environments/windows-training.txt
            environments/windows-perception-lock.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r environments/windows-training.txt
      - run: python -m pip check
      - run: python scripts/download_landmarker.py
      - run: python -m pytest -q
        env:
          MARVEL_TEST_MODEL: models/face_landmarker.task
