<text x="918" y="689" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#4b6379" text-anchor="start">Trained CNN → closure score</text>
<text x="918" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#4b6379" text-anchor="start">Apply saved calibration if selected</text>
