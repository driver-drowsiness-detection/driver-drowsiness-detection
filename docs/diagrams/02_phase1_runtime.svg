<text x="88" y="631" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#142c43" text-anchor="start">EAR branch</text>
<text x="88" y="662" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#4b6379" text-anchor="start">Pixel landmarks → eye aspect ratio</text>
<text x="88" y="689" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#4b6379" text-anchor="start">Keep raw EAR for the standalone rule</text>
<text x="88" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#4b6379" text-anchor="start">Map EAR to a closure score for fusion</text>
