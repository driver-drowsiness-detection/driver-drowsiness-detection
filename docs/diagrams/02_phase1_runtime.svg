<text x="52" y="1575" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#4b6379" text-anchor="start">UNKNOWN does not prove recovery. Long gaps break confirmed closure continuity; an earlier alarm remains in history.</text>
