<text x="52" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" fill="#142c43" text-anchor="start">Phase 1: three methods, one fair comparison</text>
<text x="52" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#4b6379" text-anchor="start">EAR and CNN are implemented separately. Combined mode uses comparable scores from the same eye and timestamp.</text>
